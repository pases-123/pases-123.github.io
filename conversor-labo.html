  function laboToNumber(str){
    if(str==null) return null;
    let s = String(str).trim();
    s = s.replace(/[^\d.,-]/g,'');
    if(s==='') return null;
    s = s.replace(',', '.');
    const n = parseFloat(s);
    return isNaN(n) ? null : n;
  }
  function laboLooksLikeUnit(line){
    const s = line.trim();
    if(s==='') return false;
    if(/^-?\d+([.,]\d+)?$/.test(s)) return false;
    return /^[A-Za-zµ³²%/º.\-\d\s]{1,18}$/.test(s) && /[A-Za-zµ%]/.test(s);
  }
  function laboLooksLikeRange(line){
    const s = line.trim().toLowerCase();
    if(s==='') return false;
    if(/estad[ií]o/.test(s)) return false;
    if(/-\s*\d+([.,]\d+)?\s*-\s*\d+([.,]\d+)?/.test(s)) return true;
    if(/\d+([.,]\d+)?\s*-\s*\d+([.,]\d+)?/.test(s)) return true;
    if(/hasta\s*\d+([.,]\d+)?/.test(s)) return true;
    if(/mayor\s*a?\s*\d+([.,]\d+)?/.test(s)) return true;
    if(/menor\s*a?\s*\d+([.,]\d+)?/.test(s)) return true;
    if(/[<>]=?\s*\d+([.,]\d+)?/.test(s)) return true;
    return false;
  }
  function laboParseRange(line, sex){
    const sLower = line.trim().toLowerCase();
    if(/\bhombre\b/.test(sLower) && /\bmujer\b/.test(sLower)){
      if(!sex) return null;
      const re = sex==='M'
        ? /\bhombre\b\s*:?\s*([\s\S]*?)(?=\bmujer\b|$)/
        : /\bmujer\b\s*:?\s*([\s\S]*)/;
      const gm = sLower.match(re);
      if(gm && gm[1]) return laboParseRangeSimple(gm[1]);
      return null;
    }
    return laboParseRangeSimple(line);
  }
  function laboParseRangeSimple(line){
    const s = line.trim().toLowerCase().replace(/,/g,'.');
    const qm = s.match(/(ideal|deseable|[oó]ptimo)\s*:?\s*(?:es\s*)?(menor\s*(?:o\s*igual\s*)?(?:a|que)?|mayor\s*(?:o\s*igual\s*)?(?:a|que)?|<=?|>=?)\s*(-?\d+(?:\.\d+)?)/);
    if(qm){
      const dirWord = qm[2];
      const num = parseFloat(qm[3]);
      if(/menor|^</.test(dirWord)) return {low:-Infinity, high:num};
      if(/mayor|^>/.test(dirWord)) return {low:num, high:Infinity};
    }
    const candidates = [];
    let m;
    m = s.match(/(-?\d+(?:\.\d+)?)\s*-\s*(-?\d+(?:\.\d+)?)/);
    if(m) candidates.push({idx:m.index, range:{low: parseFloat(m[1]), high: parseFloat(m[2])}});
    m = s.match(/hasta\s*(-?\d+(?:\.\d+)?)/);
    if(m) candidates.push({idx:m.index, range:{low: -Infinity, high: parseFloat(m[1])}});
    m = s.match(/menor\s*a?\s*(-?\d+(?:\.\d+)?)/);
    if(m) candidates.push({idx:m.index, range:{low: -Infinity, high: parseFloat(m[1])}});
    m = s.match(/mayor\s*a?\s*(-?\d+(?:\.\d+)?)/);
    if(m) candidates.push({idx:m.index, range:{low: parseFloat(m[1]), high: Infinity}});
    m = s.match(/<=?\s*(-?\d+(?:\.\d+)?)/);
    if(m) candidates.push({idx:m.index, range:{low: -Infinity, high: parseFloat(m[1])}});
    m = s.match(/>=?\s*(-?\d+(?:\.\d+)?)/);
    if(m) candidates.push({idx:m.index, range:{low: parseFloat(m[1]), high: Infinity}});
    if(candidates.length===0) return null;
    candidates.sort((a,b)=>a.idx-b.idx);
    return candidates[0].range;
  }
  function laboIsAbnormal(value, range){
    if(value==null || !range) return false;
    return value < range.low || value > range.high;
  }
  function laboDir(value, range){
    if(value==null || !range) return null;
    if(value < range.low) return 'bajo';
    if(value > range.high) return 'alto';
    return null;
  }
  function laboDetectAge(flat){
    const m = flat.match(/edad\s*:?\s*(\d{1,3})\s*a[ñn]os/i);
    if(!m) return null;
    const n = parseInt(m[1], 10);
    return isNaN(n) ? null : n;
  }
  function laboDetectSex(flat){
    const m = flat.match(/sexo\s*:?\s*(masculino|femenino)/i);
    if(!m) return null;
    return /femenino/i.test(m[1]) ? 'F' : 'M';
  }

  function laboFmtNumber(n){
    if(n==null) return null;
    let s = String(n);
    if(s.indexOf('.') !== -1){
      s = s.replace(/0+$/,'').replace(/\.$/,'');
    }
    return s;
  }
  function laboFmtMiles(n){
    const abs = Math.round(n*1000);
    return abs.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function laboNormText(s){

      .replace(/\s+/g,' ').trim();
  }
  function laboFindNumberAfter(text, startPos, maxWindow){
    const win = text.slice(startPos, startPos+maxWindow);
    const m = win.match(/(-?\d+(?:[.,]\d+)?)/);
    if(!m) return null;
    const before = win.slice(0, m.index).toLowerCase();
    if(/no se realiza|no se efectua|no reactivo|no aplica|pendiente|no corresponde/.test(before)) return null;
    return {value: laboToNumber(m[1]), endPos: startPos + m.index + m[0].length};
  }
  function laboFindPctAfter(text, startPos, maxWindow){
    const win = text.slice(startPos, startPos+maxWindow);
    const m = win.match(/(-?\d+(?:[.,]\d+)?)\s*%/);
    if(!m) return null;
    return {value: laboToNumber(m[1]), endPos: startPos + m.index + m[0].length};
  }
  function laboFindRangeAfter(text, startPos, maxWindow, sex){
    const win = text.slice(startPos, startPos+maxWindow);
    const hasGenderSplit = /\bhombre\b/i.test(win) && /\bmujer\b/i.test(win);
    if(!hasGenderSplit && !laboLooksLikeRange(win)) return null;

  function laboExtractStd(flat, param, sex){
    for(const rx of param.aliases){
      const re = new RegExp(rx.source, rx.flags.replace('g','')+'g');
      let m;
      while((m = re.exec(flat)) !== null){
        const numRes = laboFindNumberAfter(flat, m.index+m[0].length, 40);
        if(numRes && numRes.value!=null){
          const range = laboFindRangeAfter(flat, numRes.endPos, param.rangeWindow || 90, sex);
          return {value:numRes.value, range, pos:m.index};
        }
        if(re.lastIndex === m.index) re.lastIndex++;
      }
    }
    return null;
  }
  function laboExtractPct(flat, param){

  function laboExtractQual(flat, param){
    for(const rx of param.aliases){
      const re = new RegExp(rx.source, rx.flags.replace('g','')+'g');
      let m;
      while((m = re.exec(flat)) !== null){
        const win = flat.slice(m.index+m[0].length, m.index+m[0].length+60).toLowerCase();
        if(/no\s+se\s+realiza|realizado\s+el|pendiente/.test(win)){
          if(re.lastIndex === m.index) re.lastIndex++;
          continue;
        }

        const mNeg = win.match(/\bno\s+reactivo\b|\bnegativo\b/);
        const mPos = win.match(/\breactivo\b|\bpositivo\b/);
        if(mNeg && (!mPos || mNeg.index <= mPos.index)){
          return {pos:m.index, value:'No reactivo', reactive:false};
        }
        if(mPos){
          return {pos:m.index, value:'Reactivo', reactive:true};
        }
        if(re.lastIndex === m.index) re.lastIndex++;
      }
    }
    return null;
  }

  function laboExtractNumQual(flat, param, sex){
    const QRE = /\b(no\s+reactivo|reactivo|negativo|positivo|d[eé]bilmente\s+positivo|indeterminado|dudoso)\b/i;
    for(const rx of param.aliases){
      const re = new RegExp(rx.source, rx.flags.replace('g','')+'g');
      let m;
      while((m = re.exec(flat)) !== null){
        const after = m.index + m[0].length;
        const win = flat.slice(after, after+60);
        if(/no\s+se\s+realiza|pendiente/i.test(win.slice(0,40))){
          if(re.lastIndex === m.index) re.lastIndex++;
          continue;
        }
        const numM = win.match(/-?\d+(?:[.,]\d+)?/);
        const qM = win.match(QRE);
        if(numM && (!qM || numM.index < qM.index)){
          const numRes = laboFindNumberAfter(flat, after, 40);
          if(numRes && numRes.value!=null){
            const range = laboFindRangeAfter(flat, numRes.endPos, param.rangeWindow || 90, sex);
            return {kind:'num', value:numRes.value, range, pos:m.index};
          }
        } else if(qM){
          const w = qM[1].toLowerCase().replace(/\s+/g,' ');
          const abnormal = !/^(no reactivo|negativo)$/.test(w);
          return {kind:'qual', text:w.charAt(0).toUpperCase()+w.slice(1), abnormal, pos:m.index};
        }
        if(re.lastIndex === m.index) re.lastIndex++;
      }
    }
    return null;
  }

  function laboFindSeqIndex(flat, parts, fromIdx){
    let pos = fromIdx || 0;
    for(const rx of parts){
      const re = new RegExp(rx.source, rx.flags.replace('g','')+'g');
      re.lastIndex = pos;
      const m = re.exec(flat);
      if(!m) return null;
      pos = m.index + m[0].length;
    }
    return pos;
  }
  function laboFindWordAfter(flat, startPos, maxWindow){

    if(!m || !m[1]) return null;
    const value = m[1].trim().replace(/\.+$/,'');
    if(value==='') return null;
    return {value, endPos: startPos + m.index + m[0].length};
  }

  function laboExtractLiqLeuco(flat, field, sectionIdx){
    for(const rx of field.aliases){
      const re = new RegExp(rx.source, rx.flags.replace('g','')+'g');

      if(!numRes || numRes.value==null) continue;
      let text = laboFmtNumber(numRes.value);
      const unitWin = flat.slice(numRes.endPos, numRes.endPos+15);
      if(/^\s*\/?\s*mm[³3]/i.test(unitWin)) text += ' /mm³';
      const predWin = flat.slice(numRes.endPos, numRes.endPos+150);

        text += ` (Predominio ${pct}% ${tipo})`;

  function laboBuildOrina24Block(flat){

      const value = laboToNumber(rm[1]);

        const m = re.exec(win);
        if(m) cut = m.index;

      cursor += cut;
      return text;

      : 'GASA &lt; 1.1 g/dL: sugiere causas no relacionadas con hipertensión portal, como carcinomatosis peritoneal, tuberculosis peritoneal, pancreatitis, síndrome nefrótico, serositis por enfermedades del tejido conectivo, u obstrucción/infarto intestinal.';

  function laboScanTextStudy(flat, study, globalStops){
    const startRe = new RegExp(study.headerParts[0].source, study.headerParts[0].flags.replace('g','')+'g');
    const mStart = startRe.exec(flat);
    if(!mStart) return null;
    const startPos = laboFindSeqIndex(flat, study.headerParts, 0);
    if(startPos==null) return null;

    let cursor = startPos;
    let lastPos = startPos;
    const byChunk = study.chunks.map(()=>[]);

    study.chunks.forEach((chunk, ci)=>{
      const items = chunk.fields;
      let orientationDecided = false;
      let reversed = false;
      let prevEnd = cursor;

      for(let idx=0; idx<items.length; idx++){
        const item = items[idx];
        const itemRe = item.marker || item.labelRe;
        const re = new RegExp(itemRe.source, itemRe.flags.replace('g','')+'g');
        const win = flat.slice(cursor, cursor+LABO_TEXT_SEARCH_WINDOW);
        const m = re.exec(win);
        if(!m) continue;
        const labelStart = cursor + m.index;
        const labelEnd = labelStart + m[0].length;

        if(item.marker){
          cursor = labelEnd;
          prevEnd = labelEnd;
          lastPos = Math.max(lastPos, labelEnd);
          continue;
        }

        if(!orientationDecided){
          reversed = (labelStart - prevEnd) > 3;
          orientationDecided = true;
        }

        let valStart, valEnd;
        if(reversed){
          valStart = prevEnd;
          valEnd = labelStart;
        } else {
          valStart = labelEnd;
          let nextStart = null;
          for(let j=idx+1;j<items.length && nextStart==null;j++){
            const nxt = items[j];
            const nxtRe = nxt.marker || nxt.labelRe;
            const nre = new RegExp(nxtRe.source, nxtRe.flags.replace('g','')+'g');
            const winN = flat.slice(valStart, valStart+LABO_TEXT_SEARCH_WINDOW);
            const mN = nre.exec(winN);
            if(mN) nextStart = valStart + mN.index;
          }
          if(nextStart==null && globalStops){
            for(const gre of globalStops){
              const re3 = new RegExp(gre.source, gre.flags.replace('g','')+'g');
              const win3 = flat.slice(valStart, valStart+300);
              const m3 = re3.exec(win3);
              if(m3){
                const cand = valStart + m3.index;
                if(nextStart==null || cand < nextStart) nextStart = cand;
              }
            }
          }
          valEnd = nextStart!=null ? nextStart : Math.min(flat.length, valStart+45);
        }

        let valueText = flat.slice(valStart, valEnd);
        const finalM = valueText.match(/\bfinal\b/i);
        if(finalM) valueText = valueText.slice(0, finalM.index);
        valueText = valueText.replace(/\s+/g,' ').trim();
        if(valueText!==''){
          byChunk[ci].push({field:item, value:valueText, pos:labelStart});
          lastPos = Math.max(lastPos, reversed ? labelEnd : valEnd);
        }

        cursor = labelEnd;
        prevEnd = labelEnd;
      }
    });

    return {byChunk, maskStart: mStart.index, maskEnd: Math.max(lastPos, startPos+20)};
  }

  function laboUroCountAbnormal(raw, threshold){
    const s = (raw||'').toLowerCase();
    if(/abundante|regular\s+cantidad/.test(s)) return true;
    const nums = s.match(/-?\d+(?:[.,]\d+)?/g);
    if(!nums || !nums.length) return false;
    const max = Math.max(...nums.map(n=>parseFloat(n.replace(',', '.'))));
    return max > threshold;
  }
  function laboUroBacteriasQual(raw){
    const s = (raw||'').toLowerCase();
    if(/abundante|regular\s+cantidad|moderada\s+cantidad/.test(s)) return true;
    if(/no\s+se\s+observ|escasa\s+cantidad|negativ/.test(s)) return false;
    return null;
  }
  function laboUroFlagPositive(raw){
    if(raw==null) return false;
    const s = raw.trim().toLowerCase();
    if(/no\s+contiene|negativo|no\s+se\s+observ|^normal$/.test(s)) return false;
    return true;
  }
  function laboBuildUroInterpretacion(entriesByKey){
    const nitritos = entriesByKey['nitritos'];
    const esterasa = entriesByKey['esterasa'];
    const hb = entriesByKey['hb'];
    const leucos = entriesByKey['leucos'];
    const hematies = entriesByKey['hematies'];
    const bacterias = entriesByKey['bacterias'];

    const nitritosPos = nitritos && laboUroFlagPositive(nitritos);
    const esterasaPos = esterasa && laboUroFlagPositive(esterasa);
    const leucosAb = leucos && laboUroCountAbnormal(leucos, 5);
    const hbPos = hb && laboUroFlagPositive(hb);
    const hematiesAb = (hematies && laboUroCountAbnormal(hematies, 5)) || hbPos;
    const bacteriasAb = bacterias && laboUroBacteriasQual(bacterias)===true;

    const sentences = [];
    if(nitritosPos || esterasaPos || leucosAb || bacteriasAb){
      const hallazgos = [];
      if(nitritosPos) hallazgos.push('nitritos positivos');
      if(esterasaPos) hallazgos.push('esterasa leucocitaria positiva');
      if(leucosAb) hallazgos.push('leucocituria');
      if(bacteriasAb) hallazgos.push('bacteriuria');
      sentences.push(`${laboRed(hallazgos.join(', '))}: hallazgos de sedimento urinario sugestivos de infección urinaria; correlacionar con la clínica y solicitar urocultivo antes de iniciar o ajustar el tratamiento antibiótico empírico.`);
    }
    if(hematiesAb){
      sentences.push(`${laboRed('hematuria')}: correlacionar con sondaje vesical traumático, litiasis, o proceso inflamatorio/infeccioso del tracto urinario.`);
    }
    return sentences;
  }
  function laboIsNormalText(v){
    const s = v.trim().toLowerCase().replace(/\s+/g,' ');
    if(/no\s+se\s+observan?\b/.test(s)) return true;
    if(/^normal$/.test(s)) return true;
    if(/no\s+contiene/.test(s)) return true;
    if(/negativo/.test(s)) return true;
    if(/^0\s*(?:a|-)\s*1\s*\/?\s*campo$/.test(s)) return true;
    return false;
  }
  function laboSentenceCase(s){
    const t = s.trim();
    if(!t) return t;
    return t.charAt(0).toUpperCase() + t.slice(1).toLowerCase();
  }
  function laboFixSpacedRange(s){
    return s.replace(/(\d)\s*a\s*(\d)/gi, '$1 a $2');
  }
  function laboClassifyTextField(field, rawValue, fullMode){
    if(field.mode==='core'){
      let v = laboFixSpacedRange(rawValue);
      if(field.lowercase) v = v.toLowerCase();
      return {text:v, abnormal:false, core:true, show:true};
    }
    if(field.mode==='aspectoQual'){
      let v = laboFixSpacedRange(rawValue);
      if(field.lowercase) v = v.toLowerCase();
      v = v.replace(/^limpido\b/i, 'límpido');
      const abnormal = !/^(l[ií]mpido|claro|incoloro)\b/i.test(v.trim());
      return {text:v, abnormal, core:true, show:true};
    }
    if(field.mode==='cond' || field.mode==='condPlain'){
      const raw = laboFixSpacedRange(rawValue);
      if(field.cross){
        const isDefault = /no\s+contiene|negativo/i.test(raw);
        if(!isDefault){
          const plus = raw.match(/\++/);
          const num = !plus && raw.match(/-?\d+(?:[.,]\d+)?/);
          const val = plus ? plus[0] : (num ? num[0].replace(',', '.') : null);
          if(val!=null) return {text:val, abnormal:true, core:false, show:true};
        }
      }
      let normal, colorRed;
      if(field.countThreshold!=null){
        const ab = laboUroCountAbnormal(raw, field.countThreshold);
        normal = !ab; colorRed = ab;
      } else if(field.qualCheck){
        const ab = field.qualCheck(raw);
        if(ab===true){ normal=false; colorRed=true; }
        else if(ab===false){ normal=true; colorRed=false; }
        else { normal = laboIsNormalText(raw); colorRed = field.mode==='cond' && !normal; }
      } else {
        normal = laboIsNormalText(raw);
        colorRed = field.mode==='cond' && !normal;
      }
      const text = laboSentenceCase(raw);
      if(normal) return {text, abnormal:false, core:false, show: !!fullMode};
      return {text, abnormal:colorRed, core:false, show:true};
    }
    return null;
  }
  function laboTextEnabledKey(study, chunk, field){ return 'uroanalisis|' + study.id + '|' + chunk.id + '|' + field.key; }

  function laboBuildTextStudyChunkText(study, chunk, entries, fullMode){
    if(!entries || entries.length===0) return null;
    const coreParts = [];
    const condParts = [];
    let hasCoreField = false;
    let anyCondFound = false;
    entries.forEach(e=>{
      const k = laboTextEnabledKey(study, chunk, e.field);
      if(!(laboEnabled[k] ?? true)) return;
      const cls = laboClassifyTextField(e.field, e.value, fullMode);
      if(!cls) return;
      const txt = e.field.out ? (e.field.noColon ? `${e.field.out} ${cls.text}` : `${e.field.out}: ${cls.text}`) : cls.text;
      const html = cls.abnormal ? `<span style="color:#FF0000;font-weight:700;">${txt}</span>` : txt;
      if(cls.core){
        hasCoreField = true;
        coreParts.push(html);
      } else {
        anyCondFound = true;
        if(cls.show) condParts.push(html);
      }
    });
    if(hasCoreField){
      const parts = coreParts.concat(condParts);
      return parts.length>0 ? `<b>${chunk.boldLabel}</b>: ${parts.join(', ')}.` : null;
    }
    if(anyCondFound){
      return condParts.length>0
        ? `<b>${chunk.boldLabel}</b>: ${condParts.join(', ')}.`
        : `<b>${chunk.boldLabel}</b>: sin alteraciones.`;
    }
    return null;
  }
  function laboR1(n){ return Math.round(n*10)/10; }
  function laboWinterExpected(hco3){ return {low: laboR1(1.5*hco3+8-2), high: laboR1(1.5*hco3+8+2)}; }
  function laboBuildAcidBase(v, opts){
    opts = opts || {};
    if(v.ph==null || v.pco2==null || v.hco3==null) return null;
    const ph=v.ph, pco2=v.pco2, hco3=v.hco3;
    const ven = !!v.venoso;

    const T = ven ? {phLo:7.31, phHi:7.41, pcoHi:51, pcoLo:41, base:45} : {phLo:7.35, phHi:7.45, pcoHi:45, pcoLo:35, base:40};
    const acidemia = ph<T.phLo, alcalemia = ph>T.phHi;
    let primario, compensacion = '';
    if(acidemia){
      primario = (hco3<22) ? 'acidosis metabólica' : ((pco2>T.pcoHi) ? 'acidosis respiratoria' : 'acidemia (trastorno mixto, a definir con clínica)');
    } else if(alcalemia){
      primario = (hco3>26) ? 'alcalosis metabólica' : ((pco2<T.pcoLo) ? 'alcalosis respiratoria' : 'alcalemia (trastorno mixto, a definir con clínica)');
    } else if(pco2>T.pcoHi && hco3>26){
      primario = opts.showMixedValues
        ? `trastorno mixto opuesto [acidosis respiratoria (pCO2: ${laboFmtNumber(pco2)}) + alcalosis metabólica (HCO3: ${laboFmtNumber(hco3)})] con pH compensado`
        : 'trastorno mixto opuesto (acidosis respiratoria + alcalosis metabólica) con pH compensado';
    } else if(pco2<T.pcoLo && hco3<22){
      primario = opts.showMixedValues
        ? `trastorno mixto opuesto [alcalosis respiratoria (pCO2: ${laboFmtNumber(pco2)}) + acidosis metabólica (HCO3: ${laboFmtNumber(hco3)})] con pH compensado`
        : 'trastorno mixto opuesto (alcalosis respiratoria + acidosis metabólica) con pH compensado';
    } else {
      primario = ven ? 'equilibrio ácido-base dentro de parámetros normales para una muestra venosa' : 'equilibrio ácido-base dentro de parámetros normales';
    }
    if(primario==='acidosis metabólica'){
      const exp = laboWinterExpected(hco3);
      if(pco2 < exp.low) compensacion = `la pCO2 (${laboFmtNumber(pco2)}) está por debajo de la esperada (${laboFmtNumber(exp.low)}–${laboFmtNumber(exp.high)} mmHg, fórmula de Winter), lo que sugiere una alcalosis respiratoria sobreagregada`;
      else if(pco2 > exp.high) compensacion = `la pCO2 (${laboFmtNumber(pco2)}) está por encima de la esperada (${laboFmtNumber(exp.low)}–${laboFmtNumber(exp.high)} mmHg, fórmula de Winter), lo que sugiere una acidosis respiratoria sobreagregada (trastorno mixto)`;
      else compensacion = `la pCO2 (${laboFmtNumber(pco2)}) es la esperada para el grado de acidosis metabólica (${laboFmtNumber(exp.low)}–${laboFmtNumber(exp.high)} mmHg, fórmula de Winter), compatible con compensación respiratoria adecuada`;
    } else if(primario==='alcalosis metabólica'){
      const expPco2 = laboR1(T.base + (hco3-24)*0.6);
      compensacion = `la pCO2 esperada por compensación respiratoria es de aprox. ${laboFmtNumber(expPco2)} mmHg (ΔpCO2 = ΔHCO3 × 0.6); la pCO2 medida es ${laboFmtNumber(pco2)} mmHg`;
    } else if(primario==='acidosis respiratoria'){
      const dpco2 = pco2-T.base;
      const expAcute = laboR1(24 + dpco2*0.1), expChronic = laboR1(24 + dpco2*0.3);
      const fase = hco3<=expAcute+2 ? 'un componente predominantemente agudo' : (hco3>=expChronic-2 ? 'un componente crónico/corregido' : 'un cuadro parcialmente compensado (mixto)');
      compensacion = `con ΔHCO3 = ΔpCO2 × 0.1 (aguda) el HCO3 esperado es ≈${laboFmtNumber(expAcute)} mEq/L, y con ΔHCO3 = ΔpCO2 × 0.3 (crónica/corregida) sería ≈${laboFmtNumber(expChronic)} mEq/L; el HCO3 medido (${laboFmtNumber(hco3)} mEq/L) orienta a ${fase}`;
    } else if(primario==='alcalosis respiratoria'){
      const dpco2 = T.base-pco2;
      const expAcute = laboR1(24 - dpco2*0.2), expChronic = laboR1(24 - dpco2*0.4);
      compensacion = `con ΔHCO3 = ΔpCO2 × 0.2 (aguda) el HCO3 esperado es ≈${laboFmtNumber(expAcute)} mEq/L, y con ΔHCO3 = ΔpCO2 × 0.4 (crónica/corregida) sería ≈${laboFmtNumber(expChronic)} mEq/L; el HCO3 medido es ${laboFmtNumber(hco3)} mEq/L`;
    }
    const parts = [`Trastorno primario sugerido: <b>${primario}</b>${compensacion ? ('. Compensación: '+compensacion+'.') : '.'}`];

    if(ven){
      parts.push('<b>Muestra VENOSA</b>: se usaron referencias venosas (pH 7,31–7,41; pCO2 41–51 mmHg). La pO2/SO2 venosa no permite evaluar la oxigenación (no se calcula PAFI ni hipoxemia) y la interpretación de la ventilación es aproximada; si hace falta, correlacionar con clínica y gasometría arterial.');
    } else if(v.po2!=null){
      let hipoxTxt = '';
      if(v.edad!=null){
        const esperado = laboR1(102-(0.33*v.edad));
        hipoxTxt = `PO2 esperada para la edad [102 − (0,33 × ${v.edad} años)] ≈ ${laboFmtNumber(esperado)} mmHg; PO2 medida ${laboFmtNumber(v.po2)} mmHg`;
        if(v.po2 < esperado-10) hipoxTxt += ', compatible con hipoxemia significativa para la edad.';
        else if(v.po2 < esperado) hipoxTxt += ', levemente por debajo de lo esperado para la edad.';
        else hipoxTxt += ', dentro de lo esperado para la edad.';
      } else if(v.po2<80){
        hipoxTxt = `PO2 ${laboFmtNumber(v.po2)} mmHg: hipoxemia.`;
      }
      if(v.fio2!=null && v.fio2>0){
        const pafi = Math.round((v.po2/v.fio2)*10000)/100;
        const clasif = pafi>300 ? 'sin criterio de injuria pulmonar' : (pafi>200 ? 'injuria pulmonar leve' : (pafi>100 ? 'compatible con SDRA moderado' : 'compatible con SDRA severo'));
        hipoxTxt += (hipoxTxt?' ':'') + `PAFI (pO2/FiO2 × 100) = ${laboFmtNumber(pafi)}: ${clasif}.`;
      }
      if(hipoxTxt) parts.push(hipoxTxt);
    }
    return parts.join(' ');
  }

  function laboBuildEquationsList(v){
    const f = laboFmtNumber;
    const lines = [];
    if(v.hco3!=null){
      const win = laboWinterExpected(v.hco3);
      lines.push(`Ac. Met. (Winter): pCO2 esp. = 1.5×HCO3 + 8 ± 2 = 1.5×${f(v.hco3)} + 8 ± 2 ≈ ${f(win.low)}–${f(win.high)} mmHg`);
      const dHco3Alc = laboR1(v.hco3-24);
      const expPco2Alc = laboR1(40 + dHco3Alc*0.6);
      lines.push(`Alc. Met.: ΔpCO2 = ΔHCO3 × 0.6 = (${f(v.hco3)}−24) × 0.6 ≈ ${f(laboR1(dHco3Alc*0.6))} → pCO2 esp. ≈ ${f(expPco2Alc)} mmHg`);
    }
    if(v.pco2!=null){
      const dAg = laboR1(v.pco2-40);
      const expAcuteResp = laboR1(24 + dAg*0.1), expChronicResp = laboR1(24 + dAg*0.3);
      lines.push(`Ac. Resp. aguda: ΔHCO3 = ΔpCO2 × 0.1 (corregida ×0.3) = (${f(v.pco2)}−40) × 0.1/0.3 → HCO3 esp. ≈ ${f(expAcuteResp)} mEq/L (aguda) / ≈ ${f(expChronicResp)} mEq/L (corregida)`);
      const dAl = laboR1(40-v.pco2);
      const expAcuteAlc = laboR1(24 - dAl*0.2), expChronicAlc = laboR1(24 - dAl*0.4);
      lines.push(`Alc. Resp. aguda: ΔHCO3 = ΔpCO2 × 0.2 (corregida ×0.4) = (40−${f(v.pco2)}) × 0.2/0.4 → HCO3 esp. ≈ ${f(expAcuteAlc)} mEq/L (aguda) / ≈ ${f(expChronicAlc)} mEq/L (corregida)`);
    }
    if(v.po2!=null && v.fio2!=null && v.fio2>0 && !v.venoso){
      const pafi = Math.round((v.po2/v.fio2)*10000)/100;
      lines.push(`PAFI = pO2/FiO2 × 100 = ${f(v.po2)}/${f(v.fio2)} × 100 ≈ ${f(pafi)}`);
    }
    if(v.edad!=null && !v.venoso){
      const esp = laboR1(102-(0.33*v.edad));
      const extra = v.po2!=null ? `; PO2 medida ${f(v.po2)} mmHg` : '';
      lines.push(`PO2 esperada por edad = 102 − (0.33 × ${f(v.edad)}) ≈ ${f(esp)} mmHg${extra}`);
    }
    return lines;
  }

  function laboBuildGasResultHtml(v, opts){
    const interp = laboBuildAcidBase(v, opts);
    if(!interp) return '';
    const eqLines = laboBuildEquationsList(v);

    if(eqLines.length){
      html += `<br><br><b>Ecuaciones y datos del paciente</b>:<br>` + eqLines.map(l=>`• ${l}`).join('<br>');
    }
    return html;
  }

function convertir(rawInput, fechaStr){
  let raw = String(rawInput||'');
  if(!raw.trim()) return {texto:'', gas:null};
    function laboStripNumericDump(text){
      const lines = text.split(/\r?\n/);
      const isPureNum = l => /^-?[\d.,]+\s*$/.test(l.trim()) && l.trim()!=='';
      const isIdxValPair = l => /^\d+\t-?[\d.,]+\s*$/.test(l);
      const out = [];
      let i = 0;
      while(i < lines.length){
        let j = i;
        while(j < lines.length && (isPureNum(lines[j]) || isIdxValPair(lines[j]))) j++;
        if(j - i >= 15){ i = j; continue; }
        out.push(lines[i]);
        i++;
      }
      return out.join('\n');
    }
    raw = laboStripNumericDump(raw);

    const discrepCodes = [];
    let discrepHora = null;
    raw = raw.replace(/\bse\s+observa\s+discrepancia[^\t\r\n]*/gi, (m, off, whole)=>{
      const h = m.match(/muestra\s+de\s+las?\s+(\d{1,2}(?::\d{2})?)\s*h/i);
      if(h && !discrepHora) discrepHora = h[1];
      const prev = whole.slice(Math.max(0, off-160), off).replace(/[\t\r\n]+/g,' ');
      let best = null, bestEnd = -1;
      LABO_MASTER.forEach(p=>{
        if(!p.aliases || p.cat==='acidobase') return;
        p.aliases.forEach(rx=>{
          const re = new RegExp(rx.source, rx.flags.replace('g','')+'g');
          let mm;
          while((mm = re.exec(prev)) !== null){
            const end = mm.index + mm[0].length;
            if(end >= bestEnd){ bestEnd = end; best = p.code; }
            if(re.lastIndex === mm.index) re.lastIndex++;
          }
        });
      });
      if(best && !discrepCodes.includes(best)) discrepCodes.push(best);
      return ' ';
    });

    let pendingList = '';
    const pendMatch = raw.match(/an[aá]lisis\s+pendientes\s*:\s*([^\n]+)/i);
    if(pendMatch) pendingList = pendMatch[1].trim().replace(/\s*\|\s*/g, ', ');
    raw = raw.replace(/an[aá]lisis\s+pendientes\s*:[^\n]*\n?/gi, ' ');
    raw = raw.replace(/podr[aá]\s+imprimir\/?\s*descargar[^\n]*\n?/gi, ' ');
    raw = raw.replace(/esta\s+orden\s+tiene\s+resultados\s+pendientes/gi, ' ');

    let flat = raw.replace(/[\t\r\n]+/g,' ').replace(/\s+/g,' ');
    flat = flat.replace(/\b(grafico|evolucion|item)\b/gi, ' ').replace(/\s+/g,' ').trim();

    function laboMaskRanges(str, ranges){
      if(!ranges.length) return str;
      const arr = str.split('');
      ranges.forEach(r=>{ for(let i=r.start; i<r.end && i<arr.length; i++) arr[i] = ' '; });
      return arr.join('');
    }
    const liquidosRanges = LABO_LIQUIDOS_STUDIES.map(study=>{
      const startRe = new RegExp(study.headerParts[0].source, study.headerParts[0].flags.replace('g','')+'g');
      const mStart = startRe.exec(flat);
      if(!mStart) return null;
      if(laboFindSeqIndex(flat, study.headerParts, 0)==null) return null;
      return {start:mStart.index, end:flat.length};
    }).filter(Boolean);

    const textStudyScan = LABO_TEXT_STUDIES.map(study=>laboScanTextStudy(flat, study, LABO_TEXT_GLOBAL_STOPS)).filter(Boolean);
    const textStudyRanges = textStudyScan.map(s=>({start:s.maskStart, end:s.maskEnd}));

    const orina24Result = laboBuildOrina24Block(flat);
    const orina24Ranges = orina24Result ? [{start:orina24Result.maskStart, end:orina24Result.maskEnd}] : [];

    const flatMasked = laboMaskRanges(flat, liquidosRanges.concat(textStudyRanges).concat(orina24Ranges).concat((()=>{ const ai = flat.search(/ANTIBIOGRAMA/i); return ai>=0 ? [{start:ai, end:flat.length}] : []; })()));
    const sex = laboDetectSex(flat);
    const age = laboDetectAge(flat);
    const esVenoso = /estado\s+[aá]cido[\s-]*base\s+venos[oa]|gasometr[ií]a\s+venosa|gases?\s+(?:en\s+sangre\s+)?venos[oa]s?/i.test(flat);
    const LABO_VENOUS_RANGES = {
      'pH':{low:7.31, high:7.41}, 'pCO2':{low:41, high:51}, 'pO2':{low:35, high:45},
      'HCO3':{low:22, high:26}, 'SO2':{low:60, high:80},
    };
    const fio2Match = flat.match(/\bfio2\s*:?\s*(\d+(?:[.,]\d+)?)\s*%?/i);
    const fio2 = fio2Match ? laboToNumber(fio2Match[1]) : null;

    const found = [];
    LABO_MASTER.forEach(param=>{
      
      let text = null, abnormal = false, ok = false, pos = null, dir = null, rng = null;
      if(param.kind==='pct'){
        const r = laboExtractPct(flatMasked, param);
        if(r && r.value!=null){ text = `${laboFmtNumber(r.value)}%`; abnormal = false; ok = true; pos = r.pos; }
      } else if(param.kind==='plaq'){
        const r = laboExtractStd(flatMasked, param, sex);
        if(r){ text = laboFmtMiles(r.value); abnormal = laboIsAbnormal(r.value, r.range); dir = laboDir(r.value, r.range); ok = true; pos = r.pos; }
      } else if(param.kind==='pctstd'){
        const r = laboExtractStd(flatMasked, param, sex);
        if(r){ text = `${laboFmtNumber(r.value)}%`; abnormal = laboIsAbnormal(r.value, r.range); dir = laboDir(r.value, r.range); ok = true; pos = r.pos; }
      } else if(param.kind==='gas'){
        const r = laboExtractStd(flatMasked, param, sex);
        if(r){
          text = laboFmtNumber(r.value);
          let range = param.fixedRange;
          if(esVenoso && LABO_VENOUS_RANGES[param.code]){
            range = LABO_VENOUS_RANGES[param.code];
          } else if(param.code==='pO2' && age!=null){
            const esperado = 102-0.33*age;
            range = {low: esperado-10, high: 200};
          }
          abnormal = laboIsAbnormal(r.value, range);
          dir = laboDir(r.value, range);
          ok = true; pos = r.pos;
        }
      } else if(param.kind==='qual'){
        const r = laboExtractQual(flatMasked, param);
        if(r){ text = r.value; abnormal = r.reactive; ok = true; pos = r.pos; }
      } else if(param.kind==='numqual'){
        const r = laboExtractNumQual(flatMasked, param, sex);
        if(r){
          if(r.kind==='num'){ text = laboFmtNumber(r.value); abnormal = laboIsAbnormal(r.value, r.range); dir = laboDir(r.value, r.range); rng = r.range; }
          else { text = r.text; abnormal = r.abnormal; dir = r.abnormal ? 'alto' : null; }
          ok = true; pos = r.pos;
        }
      } else if(param.kind==='raw'){
        const r = laboExtractStd(flatMasked, param, sex);
        if(r){
          text = laboFmtNumber(r.value); abnormal = false; dir = null; ok = true; pos = r.pos;
          if(param.code==='RIN'){

            const rg = (r.range && r.range.high!=null && r.range.high<=10) ? r.range : {low:0.8, high:1.2};
            if(r.value > rg.high){ abnormal = true; dir = 'alto'; }
          }
        }
      } else {
        const r = laboExtractStd(flatMasked, param, sex);
        if(r){

          if(param.code==='UREA') r.range = {low:(r.range && isFinite(r.range.low)) ? r.range.low : -Infinity, high:47};
          if(param.code==='CR') r.range = {low:0.6, high:1.5};
          if(param.code==='FG'){

            const m3 = flatMasked.slice(r.pos).match(/estad[ií]o\s*3[^\d]{0,20}(\d+(?:[.,]\d+)?)\s*-\s*(\d+(?:[.,]\d+)?)/i);
            const lim = m3 ? Math.ceil(parseFloat(m3[2].replace(',','.'))) : 59;
            if(!(r.range && isFinite(r.range.low))) r.range = {low: lim + 1, high: Infinity};
          }
          text = laboFmtNumber(r.value); abnormal = laboIsAbnormal(r.value, r.range); dir = laboDir(r.value, r.range); rng = r.range; ok = true; pos = r.pos;
        }
      }
      if(ok) found.push({code:param.code, text, abnormal, l1:param.l1, l2:param.l2, pos, dir, range:rng});
    });

    {
      const uF = found.find(f=>f.code==='UREA'), cF = found.find(f=>f.code==='CR');
      if(uF && cF && uF.dir==='alto' && !cF.dir && laboToNumber(uF.text)<=60){
        uF.dir = null; uF.abnormal = false; uF.mildUrea = true;
      }
    }
    const CORE_ALIAS_ALL = LABO_MASTER.flatMap(p=>p.aliases).concat(LABO_LIQUIDOS_FIELDS.flatMap(f=>f.aliases||[])).concat(TEXT_STUDY_ALIAS_ALL);
    const rawLines = raw.split(/\r?\n/);
    const extras = [];
    const seenNames = new Set();
    let cursor = 0;
    for(let i=0;i<rawLines.length;i++){
      let candidate = rawLines[i].trim();
      if(/:\s*$/.test(candidate)) continue;
      candidate = candidate.replace(/^(grafico|evolucion|item)\s*/i,'').trim();
      const digitCut = candidate.search(/\d/);
      if(digitCut !== -1) candidate = candidate.slice(0, digitCut).trim();
      candidate = candidate.replace(/[\t:]+$/,'').trim();
      if(candidate==='') continue;
      if(!/[a-zA-Z]/.test(candidate)) continue;
      if(candidate.length < 3) continue;
      const norm = laboNormText(candidate);
      if(SECTION_STOPWORDS.includes(norm)) continue;
      if(EXTRA_STOPWORD_SUBSTR.some(w=>norm.includes(w))) continue;
      if(/^m[eé]todo/i.test(candidate)) continue;
      if(/\b(hombre|mujer|var[oó]n|masculino|femenino)\s*:/i.test(candidate)) continue;
      if(laboLooksLikeRange(candidate)) continue;
      if(laboLooksLikeUnit(candidate)) continue;
      if(candidate === candidate.toUpperCase() && /[A-Za-zÁÉÍÓÚÑ]/.test(candidate)) continue;
      if(CORE_ALIAS_ALL.some(rx=>rx.test(candidate))) continue;
      if(seenNames.has(norm)) continue;

      const flatCandidate = candidate.replace(/\s+/g,' ');
      let extraPos = flatMasked.indexOf(flatCandidate, cursor);
      if(extraPos === -1) extraPos = flatMasked.indexOf(flatCandidate);
      if(extraPos === -1) continue;
      const afterPos = extraPos + flatCandidate.length;
      const numRes = laboFindNumberAfter(flatMasked, afterPos, 30);
      if(!numRes || numRes.value==null) continue;
      const range = laboFindRangeAfter(flatMasked, numRes.endPos, 60);
      if(!laboIsAbnormal(numRes.value, range)) continue;

      seenNames.add(norm);
      extras.push({code:candidate, text:laboFmtNumber(numRes.value), abnormal:laboIsAbnormal(numRes.value, range), l1:true, l2:false, pos:extraPos});
      cursor = numRes.endPos;
    }

    const prefix = fechaStr ? fechaStr + ': ' : '';
    const byC = {};
    found.forEach(f=>{ if(!(f.code in byC)) byC[f.code] = f; });
    const used = new Set();
    const fmtC = f=>{
      let t = String(f.text).replace('%','').trim();
      if(f.code==='PLAQ'){
        const n = parseFloat(t.replace(/\./g,''));
        if(!isNaN(n)) t = laboFmtNumber(n>=1000 ? n/1000 : n);
      }
      return t.replace('.', ',');
    };
    const positional = codes=>{
      const arr = codes.map(c=>{
        const f = byC[c];
        if(!f) return '-';
        used.add(c);
        return fmtC(f);
      });
      while(arr.length && arr[arr.length-1]==='-') arr.pop();
      return arr;
    };
    const labeled = pairs=>{
      const out = [];
      pairs.forEach(([c, lbl])=>{
        const f = byC[c];
        if(!f) return;
        used.add(c);
        out.push(`${lbl}: ${fmtC(f)}`);
      });
      return out;
    };
    let caCorrTail = '';
    {
      const caF0 = byC['Ca'], albF0 = byC['ALB'];
      const caLab = caF0 ? laboToNumber(caF0.text) : null;
      const albLab = albF0 ? laboToNumber(albF0.text) : null;
      const caRange = (caF0 && caF0.range) || {low:8.5, high:10.5};
      if(caLab!=null && albLab!=null){
        const corr = laboCaCalc(caLab, albLab);
        if(caF0.abnormal || (albLab<4 && laboIsAbnormal(corr, caRange))){
          caCorrTail = ', Calcio corregido: ' + String(laboFmtNumber(corr)).replace('.', ',');
        }
      }
    }
    const groups = [];
    const addGroup = (label, parts, tail)=>{
      if(parts.length) groups.push(`${label}: ${parts.join('|')}${tail||''}.`);
    };
    const hPos = positional(['GB','N','GR','HB','HTO','PLAQ']);
    const retic = labeled([['Reticulocitos','Reticulocitos']]);
    addGroup('H', hPos.length ? hPos : (retic.length ? ['-'] : []), retic.length ? ', ' + retic[0] : '');
    addGroup('Q', positional(['GLUC','UREA','CR']));
    addGroup('I', positional(['Na','K','CL']).concat(labeled([['Ca','Ca'],['Ca ion','Ca ion'],['P','P'],['Mg','Mg'],['ALB','Alb']])), caCorrTail);
    addGroup('HEP', positional(['GPT','GOT','FAL','BT','BD','GGT']));
    addGroup('C', positional(['TP%','RIN','KPTT']));
    addGroup('RFA', positional(['PCR','ERS']));
    {
      const serPres = ['VDRL','HBc Total','HBc IgM','HBsAg','HCV','HIV Ag','HIV Ac','Chagas ELISA','Chagas HAI'].filter(c=>byC[c]);
      if(serPres.length){
        serPres.forEach(c=>used.add(c));
        const reac = serPres.filter(c=>byC[c].abnormal);
        groups.push(reac.length ? `Serología: ${reac.map(c=>`${c} reactivo`).join(', ')}.` : 'Serología: Negativa.');
      }
    }
    {
      const ebv = ['EBV EBNA','EBV VCA IgG','EBV VCA IgM'].filter(c=>byC[c]);
      if(ebv.length){
        ebv.forEach(c=>used.add(c));
        groups.push('EBV: ' + ebv.map(c=>`${c.replace('EBV ','')} ${byC[c].abnormal ? 'reactivo' : 'no reactivo'}`).join(', ') + '.');
      }
      if(byC['HAV Total']){
        used.add('HAV Total');
        groups.push(`Hepatitis A total: ${byC['HAV Total'].abnormal ? 'reactivo' : 'no reactivo'}.`);
      }
    }
    const NO_EN_RESTO = ['Cayados','L','M','E','B','VCM','HCM','CHCM','RDW','VPM','FG','IR','No HDL'];
    const rest = found.filter(f=>!used.has(f.code) && !NO_EN_RESTO.includes(f.code) && f.text!=='No reactivo').concat(extras)
      .sort((a,b)=>(a.pos??0)-(b.pos??0))
      .map(f=>`${f.code==='vitamina B12' ? 'B12' : f.code}: ${fmtC(f)}`);
    if(rest.length) groups.push(rest.join(', ') + '.');

    const bloques = [];
    LABO_LIQUIDOS_STUDIES.forEach(study=>{
      const si = laboFindSeqIndex(flat, study.headerParts, 0);
      if(si==null) return;
      const parts = [];
      LABO_LIQUIDOS_FIELDS.forEach(field=>{
        let r = null;
        if(field.kind==='liqtext') r = laboExtractLiqAspecto(flat, field, si);
        else if(field.kind==='liqleuco') r = laboExtractLiqLeuco(flat, field, si);
        else if(field.kind==='liqhema') r = laboExtractLiqHema(flat, field, si);
        else r = laboExtractLiqStd(flat, field, si);
        if(r && r.value!=null && r.value!=='') parts.push(`${field.code || 'Aspecto'}: ${r.value}`);
      });
      if(parts.length) bloques.push('Líquido ascítico: ' + parts.join(', ') + '.');
    });
    LABO_TEXT_STUDIES.forEach(study=>{
      const scan = laboScanTextStudy(flat, study, LABO_TEXT_GLOBAL_STOPS);
      if(!scan) return;
      const parts = [];
      scan.byChunk.forEach(arr=>arr.forEach(e=>{
        const cls = laboClassifyTextField(e.field, e.value, false);
        if(!cls || !cls.show) return;
        const tx = String(cls.text).replace(/^positivo\s*(\++)$/i,'$1').replace(/\/\s+campo/gi,'/campo');
        parts.push(e.field.out ? (e.field.noColon ? `${e.field.out} ${tx}` : `${e.field.out}: ${tx}`) : tx);
      }));
      if(parts.length) bloques.push((study.id==='uroanalisis' ? 'Uroanálisis' : 'Urocultivo') + ': ' + parts.join(', ') + '.');
    });
    {
      const ai = flat.search(/ANTIBIOGRAMA/i);
      if(ai>=0){
        const seg = flat.slice(ai).replace(/^.*?\bCIM\b\s*/i,'');
        const S = [], In = [], R = [];
        seg.split(/\bFinal\b/).forEach(ch=>{
          const m = ch.trim().match(/^(.+?)\s+(Sensible|Intermedio|Resistente)\b/i);
          if(!m) return;
          (/^s/i.test(m[2]) ? S : (/^i/i.test(m[2]) ? In : R)).push(m[1].trim());
        });
        const pp = [];
        if(S.length) pp.push('S: ' + S.join(', '));
        if(In.length) pp.push('I: ' + In.join(', '));
        if(R.length) pp.push('R: ' + R.join(', '));
        if(pp.length) bloques.push('Antibiograma: ' + pp.join('; ') + '.');
      }
    }
    if(orina24Result){
      bloques.push('Orina 24 hs: ' + orina24Result.items.map(it=>`${it.code}: ${it.text}`).join(', ') + '.');
    }

    const lineas = [];
    if(groups.length) lineas.push(groups.join('    '));
    bloques.forEach(b=>lineas.push(b));
    if(lineas.length) lineas[0] = prefix + lineas[0];
    const gv = c=> byC[c] ? laboToNumber(byC[c].text) : null;
    const gas = {ph:gv('pH'), pco2:gv('pCO2'), hco3:gv('HCO3'), po2:gv('pO2'), edad:age, fio2:fio2, venoso:esVenoso};
    return {texto: lineas.join('\n'), gas};
  }

  function gasesTexto(v){
    const html = laboBuildGasResultHtml(v, {showMixedValues:false});
    return String(html||'').replace(/<br>/g,'\n').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>');
  }
  if(typeof module!=='undefined') module.exports = {convertir, gasesTexto};


function hoy(){ const t=new Date(); return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0'); }
function fechaCorta(iso){ if(!iso) return ''; const p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }
const $in=document.getElementById('entrada'), $out=document.getElementById('salida'), $f=document.getElementById('fecha');
function fmtSalida(t){
  const e=String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return e.replace(/(^|\n|: |    )(H|Q|I|HEP|C|RFA|Serología|EBV|Hepatitis A total|Líquido ascítico|Uroanálisis|Urocultivo|Antibiograma|Orina 24 hs)(:)/g,'$1<b>$2$3</b>');
}
$out.addEventListener('copy',function(ev){
  const sel=window.getSelection(); if(!sel||sel.rangeCount===0||sel.isCollapsed) return;
  const box=document.createElement('div'); box.appendChild(sel.getRangeAt(0).cloneContents());
  box.querySelectorAll('*').forEach(el=>{ el.removeAttribute('style'); });
  const htm='<div style="font-family:Calibri,Carlito,Arial,sans-serif;font-size:12pt;color:#000000;white-space:pre-wrap;">'+box.innerHTML+'</div>';
  if(ev.clipboardData){ ev.clipboardData.setData('text/html',htm); ev.clipboardData.setData('text/plain',sel.toString()); ev.preventDefault(); }
});
$f.value=hoy();
function convertirUI(){
  const r=convertir($in.value, fechaCorta($f.value));
  $out.innerHTML=fmtSalida(r.texto);
}
let tm=null; const prog=()=>{ clearTimeout(tm); tm=setTimeout(convertirUI,150); };
$in.addEventListener('input',prog); $in.addEventListener('paste',prog); $f.addEventListener('change',prog);
document.getElementById('limpiar').addEventListener('click',()=>{ $in.value=''; $out.innerHTML=''; $in.focus(); });
</script></body></html>
